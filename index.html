<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renkus-Heinz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,1000&family=Inter:wght@400;600&display=swap"
    />
  </head>
  <body>
    <header class="header">
      <a class="header__logo" href="/" aria-label="Renkus-Heinz — home">
        <img
          class="header__logo-img"
          src="/src/assets/logo.svg"
          width="203"
          height="32"
          alt=""
        />
      </a>

      <nav class="header__nav nav" aria-label="Main">
        <ul class="nav__list">
          <li class="nav__item"><a class="nav__link" href="#">Why Us</a></li>
          <li class="nav__item"><a class="nav__link" href="#">Get Started</a></li>
          <li class="nav__item"><a class="nav__link" href="#">Spaces</a></li>
          <li class="nav__item"><a class="nav__link" href="#">Products</a></li>
          <li class="nav__item"><a class="nav__link" href="#">Technologies</a></li>
        </ul>
      </nav>

      <div class="header__actions">
        <button class="icon-button header__search" type="button" aria-label="Search">
          <img
            class="icon-button__icon"
            src="/src/assets/icons/search.svg"
            width="16"
            height="16"
            alt=""
          />
        </button>
        <button class="icon-button header__menu" type="button" aria-label="Menu">
          <img
            class="icon-button__icon"
            src="/src/assets/icons/burger.svg"
            width="16"
            height="16"
            alt=""
          />
        </button>
      </div>
    </header>

    <main class="main">
      <section class="hero" aria-labelledby="hero-title">
        <img
          class="hero__photo"
          src="/src/assets/hero/hero.jpg"
          width="2163"
          height="1341"
          alt=""
          fetchpriority="high"
        />
        <div class="hero__inner">
          <div class="hero__content">
            <h1 class="hero__title" id="hero-title">
              <span class="hero__title-lead">A California company, </span>
              <span class="hero__title-main">built around sound</span>
            </h1>
            <p class="hero__text">
              Family-owned and independent since 1979, Renkus-Heinz designs and builds
              professional loudspeakers in Southern California.
            </p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
